<style>
.head{display:flex;gap:18px;align-items:center;padding:36px 0 22px;flex-wrap:wrap}
.head img{width:96px;height:96px;border-radius:16px;object-fit:cover;background:var(--panel2)}

.stack{display:flex;flex-direction:column;gap:18px}
.checks{display:flex;flex-direction:column}
.ck{display:grid;grid-template-columns:22px 1fr;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
.ck:last-child{border:0}
.dot{width:10px;height:10px;border-radius:50%;margin-top:6px;background:var(--dim)}
.ck.ok .dot{background:var(--ok)}.ck.warn .dot{background:var(--warn)}.ck.bad .dot{background:var(--bad)}
.ck b{font-weight:600;font-size:14.5px;display:block}
.ck span{color:var(--mut);font-size:13.5px}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.stat small{display:block;color:var(--mut);font-size:12px}.stat b{font:500 17px var(--mono)}
.bar{height:6px;background:var(--panel2);border-radius:99px;overflow:hidden;margin-top:12px}.bar i{display:block;height:100%;background:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:13.5px}td{padding:7px 0;border-bottom:1px solid var(--line)}td:last-child{text-align:right;font-family:var(--mono)}
.links{display:flex;gap:8px;flex-wrap:wrap}
.skel{color:var(--dim)}
</style>
</head>
<body class="sb">

(function(){

  c.appendChild(h('div',{style:'display:flex;gap:8px;flex-wrap:wrap'},sells));c.appendChild(err);c.appendChild(log);

    var p=window.phantom&&window.phantom.solana||window.solana;if(!p)return Promise.reject(new Error('No Solana wallet found in this browser.'));
    return p.connect().then(function(r){return{wallet:p,address:r.publicKey.toString()}});
  }
  function refresh(){
    if(!Bn())return;info.textContent='Reading…';
    signer().then(function(sg){return Promise.all([Bn().balanceOf(j.cluster,sg.address),Bn().tokenBalance(j.cluster,sg.address,j.mint)]).then(function(r){info.textContent=sg.address.slice(0,4)+'…'+sg.address.slice(-4)+' holds '+(+r[0]).toFixed(4)+' SOL and '+fx(r[1].ui,0)+' $'+j.symbol})}).then(null,function(e){info.textContent=e.message})}

  var tries=0;(function wait(){if(Bn())return refresh();if(tries++<40)setTimeout(wait,250)})();

}

  var left=h('div',{class:'stack'}),right=h('div',{class:'stack'});

fetch('/api/coin/'+mint).then(function(r){return r.json().then(function(j){if(!r.ok)throw new Error(j.error||'Not found');return j})}).then(render).catch(function(e){var m=document.getElementById('main');m.textContent='';m.appendChild(h('div',{class:'empty',style:'margin:40px 0;padding:40px 16px;text-align:center;color:var(--mut);border:1px dashed var(--line2);border-radius:12px',text:e.message}))});
  var wp=function(){return window.phantom&&window.phantom.solana||window.solana},wb=document.getElementById('wbtn'),wm=document.getElementById('wmenu'),wa=null;
